name = "reviewer-vault-files"
main = "index.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "reviewer-vault-files"

[vars]
# Comma-separated list of allowed site origins. No '*' in production.
ALLOWED_ORIGINS = "https://sce-reviewer.vercel.app"
# Token enforcement is ON by default. Override via wrangler secret or .dev.vars if needed.
REQUIRE_TOKEN = "1"
